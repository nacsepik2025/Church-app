<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAC Sepik</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A3D8F"><style>body{margin:0;font-family:Arial;background:#f5f5f5}.h{background:#0A3D8F;color:#fff;padding:15px;text-align:center;font-weight:bold}.t{display:flex}.t button{flex:1;padding:12px;border:none}.a{background:#0A3D8F;color:#fff}.i{background:#222;color:#fff}.c{background:#fff;margin:10px;padding:15px;border-radius:8px}input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}.b{background:#0A3D8F;color:#fff;padding:14px;width:100%;border:none;border-radius:6px;font-size:16px}label{font-weight:bold;font-size:13px}</style></head><body>
<div class="h">† NAC GREATER SEPIK<br>CLOUD</div>
<div class="t"><button class="a" id="b1" onclick="show('new')">New Report</button><button class="i" id="b2" onclick="show('his')">History</button><button class="i" id="b3" onclick="show('sum')">Summary</button></div>
<div id="new" class="c"><label>Congregation<input id="cg" placeholder="e.g. Wewak Central"></label><label>District<select id="ds"><option>Wewak</option><option>Wewak Island</option><option>Maprik</option><option>Angoram</option><option>Lumi</option><option>Aitape</option><option>Vanimo</option></select></label><label>Date<input id="dt" type="date"></label><label>AM/PM<select id="ap"><option>AM</option><option>PM</option></select></label><label>Kina<input id="k" type="number"></label><label>Toea<input id="t" type="number"></label><label>Attendance<input id="at" type="number"></label><label>Officiant 1<input id="o1"></label><label>Officiant 2<input id="o2"></label><button class="b" onclick="sv()">Submit Report ✓</button><p style="font-size:10px">Owner: krakawatomarum279@gmail.com - Works offline</p></div>
<div id="his" class="c" style="display:none"><h3>History</h3><div id="ls"></div><button class="b" onclick="ex()">Export Excel</button></div>
<div id="sum" class="c" style="display:none"><h3>Summary</h3>Reports: <b id="tr">0</b><br>Attendance: <b id="ta">0</b><br>Offering K<b id="to">0</b></div>
<script>
dt.valueAsDate=new Date();let R=JSON.parse(localStorage.getItem('nac')||'[]');
function show(x){new.style.display=x=='new'?'block':'none';his.style.display=x=='his'?'block':'none';sum.style.display=x=='sum'?'block':'none';b1.className=b2.className=b3.className='i';document.getElementById('b'+(x=='new'?1:x=='his'?2:3)).className='a';if(x!='new')ld();}
function sv(){let o={c:cg.value,d:ds.value,dt:dt.value,ap:ap.value,k:parseFloat(k.value||0),tt:parseFloat(t.value||0),a:parseInt(at.value||0),o1:o1.value,o2:o2.value,tot:(parseFloat(k.value||0)+parseFloat(t.value||0)/100).toFixed(2)};if(!o.c){alert('Enter Congregation');return;}R.push(o);localStorage.setItem('nac',JSON.stringify(R));alert('Saved K'+o.tot);cg.value='';k.value='';t.value='';at.value='';ld();}
function ld(){if(R.length==0){ls.innerHTML='No reports';return;}ls.innerHTML=R.map(x=>`<div style="border-bottom:1px solid #ddd;padding:5px"><b>${x.c}</b> - ${x.d} - ${x.dt}<br>Att ${x.a} | K${x.tot}</div>`).join('');tr.innerText=R.length;ta.innerText=R.reduce((s,x)=>s+x.a,0);to.innerText=R.reduce((s,x)=>s+parseFloat(x.tot),0).toFixed(2);}
function ex(){let csv="Date,Congregation,District,AMPM,Kina,Toea,Total,Attendance,O1,O2\n";R.forEach(x=>csv+=`${x.dt},${x.c},${x.d},${x.ap},${x.k},${x.tt},${x.tot},${x.a},${x.o1},${x.o2}\n`);let b=new Blob([csv],{type:'text/csv'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='NAC_Reports.csv';a.click();}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');ld();
</script></body></html>
