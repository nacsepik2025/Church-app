
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church Offering & Attendance Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 10px;
    }

    .form-container {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      max-width: 100%;
      width: 100%;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      font-size: 1.5em;
    }

    label {
      display: block;
      margin-top: 12px;
      color: #333;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1em;
    }

    button:hover {
      background: #218838;
    }

    @media (min-width: 600px) {
      .form-container {
        max-width: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Divine Service Report</h2>
    <form id="churchForm">
      <label for="date">Date of Service</label>
      <input type="date" id="date" name="date" required />

      <label for="type">Type of Service</label>
      <select id="type" name="type" required>
        <option value="Sunday">Sunday</option>
        <option value="Midweek">Midweek</option>
        <option value="Special">Special</option>
      </select>

      <label for="place">Place of Service</label>
      <input type="text" id="place" name="place" required />

      <label for="ministers">Ministers Conducting Service</label>
      <textarea id="ministers" name="ministers" rows="2" required></textarea>

      <label for="rector">District Rector In-Charge</label>
      <input type="text" id="rector" name="rector" required />

      <label for="offering">Amount of Offering (Kina)</label>
      <input type="number" id="offering" name="offering" step="0.01" required />

      <label for="attendance">Number of Attendees</label>
      <input type="number" id="attendance" name="attendance" required />

      <button type="submit">Submit Report</button>
    </form>
  </div>

  <script>
    document.getElementById('churchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = {
        date: document.getElementById('date').value,
        type: document.getElementById('type').value,
        place: document.getElementById('place').value,
        ministers: document.getElementById('ministers').value,
        rector: document.getElementById('rector').value,
        offering: document.getElementById('offering').value,
        attendance: document.getElementById('attendance').value
      };

      fetch('https://script.google.com/macros/s/PASTE_YOUR_WEB_APP_URL_HERE/exec', {
        method: 'POST',
        body: JSON.stringify(formData),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.text())
      .then(data => {
        alert('Data submitted successfully!');
        document.getElementById('churchForm').reset();
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Something went wrong.');
      });
    });
  </script>
</body>
</html>
